[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clasificacion-salud-mental"
version = "0.1.0"
description = "Comparación de modelos de regresión logística para una etiqueta de salud mental"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "scikit-learn",
    "seaborn",
]

[project.scripts]
clasificacion-salud-mental = "mental_health_classification.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
